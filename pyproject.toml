[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-assistant-voice-backend"
version = "0.1.0"
description = "AI learning assistant voice backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "click",
    "fastapi",
    "numpy>=2.0.0,<3.0.0",
    "soundfile",
    "uvicorn",
    "toml",
]

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
    "misaki[zh]>=0.8.2",
    "soundfile",
]
"f5-tts" = [
    "f5-tts==1.1.4",
]

[project.scripts]
ai-tts-cli = "cli:cli"
ai-tts-test = "test_client:main"

[tool.uv.pip]
# Use Aliyun mirror for PyPI
index-url = "https://mirrors.aliyun.com/pypi/simple"